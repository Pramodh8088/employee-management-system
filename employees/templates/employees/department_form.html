{% extends "employees/base.html" %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">

        <h3 class="mb-0">

            {% if department %}
                Update Department
            {% else %}
                Add Department
            {% endif %}

        </h3>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">Department Name</label>

                <input
                    type="text"
                    class="form-control"
                    name="name"
                    value="{{ department.name|default:'' }}"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">Location</label>

                <input
                    type="text"
                    class="form-control"
                    name="location"
                    value="{{ department.location|default:'' }}"
                    required
                >

            </div>

            <button class="btn btn-success">

                {% if department %}
                    Update Department
                {% else %}
                    Add Department
                {% endif %}

            </button>

            <a href="{% url 'department_list' %}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
